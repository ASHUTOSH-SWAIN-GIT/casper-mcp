services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casper
      POSTGRES_PASSWORD: casper
      POSTGRES_DB: casper
    ports:
      - "5432:5432"
    volumes:
      - casper-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casper -d casper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casper-postgres:
